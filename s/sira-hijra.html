<title>من بيعتَي العقبة إلى الهجرة النبوية الشريفة — على بصيرة AI</title>
<meta name="description" content="واصل رسول الله ﷺ دعوته إلى الله تعالى في مواسم الحج، يعرض الإسلام على القبائل، ويدعوها إلى توحيد الله ونصرة رسالته. وقد هيأ الله تعالى لهذه الدعوة المباركة رجالا من أهل يثرب، آمنوا برسول الله ﷺ، وعادوا إلى قومهم يدعونهم إلى الإسلام. ثم جاءت بيعتا العقبة، وبدأت هجرة المسلمين إلى يثرب، حيث وجد المسلمون من يستقبلهم ويؤويهم. ولما أذن الله تعالى لرسوله ﷺ بالهجرة، خرج بصحبة أبي بكر الصديق رضي الله عنه، وحفظهما الله في غار ثور، حتى بلغا المدينة المنورة، حيث استقبل أهلها رسول الله ﷺ بفرح عظيم، وبدأت مرحلة جديدة من تاريخ الرسالة المحمدية.">
