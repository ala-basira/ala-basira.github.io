<title>بناء المجتمع النبوي — على بصيرة AI</title>
<meta name="description" content="بعد أن أكرم الله تعالى رسوله سيدنا محمدا ﷺ بالهجرة إلى المدينة المنورة، بدأت مرحلة عظيمة من تاريخ الإسلام، انتقلت فيها الجماعة المؤمنة إلى بناء مجتمع يستمد قيمه من القرآن الكريم وهدي النبوة. فأسس رسول الله ﷺ المسجد النبوي، وآخى بين المهاجرين والأنصار، ونظم العلاقات بين سكان المدينة، وعلم أصحابه أمور دينهم، ورباهم على الرحمة والعدل والتعاون. وفي هذه المرحلة شرع الأذان، وتحولت القبلة إلى المسجد الحرام، وفرض صيام رمضان. وهكذا أخذ المجتمع النبوي ينمو على أساس الإيمان بالله تعالى، مقترنا بالعلم والعمل وحسن الخلق ورعاية حقوق الناس.">
