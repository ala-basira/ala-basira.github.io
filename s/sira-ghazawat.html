<title>الغزوات الكبرى وحماية الدعوة — على بصيرة AI</title>
<meta name="description" content="في المدينة المنورة، بدأت مرحلة جديدة من سيرة رسول الله ﷺ، انتقل فيها المسلمون من الصبر على الأذى والاضطهاد في مكة إلى بناء مجتمعهم والدفاع عن دينهم وأنفسهم. وبعد أن أذن الله للمؤمنين بالقتال، شهدت هذه المرحلة أحداثًا عظيمة، كان من أبرزها غزوتا بدر وأُحد. ولم تكن هذه الغزوات مجرد مواجهات عسكرية، بل كانت مواقف ظهرت فيها أحكام الإسلام في القتال، وهدي النبي ﷺ في الشورى، ورحمته بالناس، ووجوب طاعته، والصبر على الابتلاء. ومن خلال هذه الأحداث، نتعرف إلى جوانب من سيرته ﷺ، وإلى ما حملته من هداية للمؤمنين.">
