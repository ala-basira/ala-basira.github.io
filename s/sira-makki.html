<title>الدعوة الإسلامية في مكة المكرمة — على بصيرة AI</title>
<meta name="description" content="بدأ رسول الله ﷺ دعوته في مكة المكرمة، فدعا الناس إلى توحيد الله وترك عبادة الأصنام، وعلّم المؤمنين الأوائل القرآن الكريم وأصول الإسلام. ثم جهر بالدعوة امتثالا لأمر الله تعالى، فواجه هو وأصحابه الأذى والمقاطعة، وهاجر بعض المسلمين إلى الحبشة حفاظا على دينهم. وواصل النبي ﷺ تبليغ رسالته بالصبر والحكمة والرحمة، رغم ما أصابه من الشدائد وفقد أحب الناس إليه. وفي هذه المرحلة من العهد المكي أكرمه الله تعالى بمعجزة الإسراء والمعراج، التي تجلت فيها عظمة قدره وشرف منزلته عند ربه.">
